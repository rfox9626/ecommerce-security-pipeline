name: Deploy E-Commerce Pipeline

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        working-directory: ./terraform
        run: terraform init

      # --- PASS 1: BUILD ALL INFRASTRUCTURE & ECR (EXCLUDING LAMBDAS) ---
      - name: Terraform Apply (Infrastructure Only)
        working-directory: ./terraform
        run: terraform apply -auto-approve -exclude=aws_lambda_function.api_ingress -exclude=aws_lambda_function.queue_worker

      # --- PASS 2: LOGIN TO ECR & PUSH DOCKER IMAGES ---
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and Push Ingress API Docker Image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ecommerce-lambda-v2
          IMAGE_TAG: latest
        working-directory: ./services/ingress-api
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

      - name: Build and Push Worker Processor Docker Image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: sqs-redis-handler-v2
          IMAGE_TAG: latest
        working-directory: ./services/worker-processor
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

      # --- PASS 3: FULL APPLY (NOW CREATES THE LAMBDAS USING THE NEW IMAGES) ---
      - name: Terraform Apply (Create Lambdas & Final Wiring)
        working-directory: ./terraform
        run: terraform apply -auto-approve
